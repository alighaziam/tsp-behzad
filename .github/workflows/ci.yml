name: Trusted Taxpayers CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    env:
      # Test-only key; never reused by deployments.
      APP_JWT_SECRET: bG9jYWwtY2ktb25seS1ub3QtZm9yLXByb2R1Y3Rpb24ta2V5IQ==
    name: Java 17 / Maven multi-module verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify all Maven modules
        run: mvn --batch-mode --no-transfer-progress clean verify
