spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${PORT:8080}

# CORS Configuration for Production
cors:
  # لیست origins مجاز (با کاما جدا شده)
  # مثال: https://app.example.com,https://admin.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Taxpayer System Integration (Production)
taxpayer-system:
  # Derived from SDK samples in repository
  base-url: https://beta.nta.local/requestsmanager/api/tsp
  api-path: /api/invoices
  client-id: TP1101
  org-key-id: 6a2bcd88-a871-4245-a393-2843eafe6e02
  org-public-key: |
    
  timeout:
    connect: 10000
    read: 30000
  retry:
    max-attempts: 3
    backoff-delay: 1000


