spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: ${PORT:8080}

# CORS Configuration for Production
cors:
  # لیست origins مجاز (با کاما جدا شده)
  # مثال: https://app.example.com,https://admin.example.com
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Taxpayer System Integration (Production)
taxpayer-system:
  # Derived from SDK samples in repository
  base-url: ${TAXPAYER_SYSTEM_URL}
  api-path: /api/invoices
  client-id: ${TAX_CLIENT_ID}
  org-key-id: ${TAX_ORG_KEY_ID}
  org-public-key: ${TAX_ORG_PUBLIC_KEY}
  timeout:
    connect: 10000
    read: 30000
  retry:
    max-attempts: 3
    backoff-delay: 1000

# Production Tax SDK settings: never inherit sandbox endpoints or sample identities.
tax:
  sdk:
    base-url: ${TAX_SDK_BASE_URL}
    memory-id: ${TAX_SDK_MEMORY_ID}
    client-id: ${TAX_SDK_CLIENT_ID}
    private-key-path: ${TAX_SDK_PRIVATE_KEY_PATH}
    private-key-password: ${TAX_SDK_PRIVATE_KEY_PASSWORD:}
    request-timeout-ms: ${TAX_SDK_REQUEST_TIMEOUT_MS:30000}

# Keep outbound webhooks disabled until an egress proxy with IP pinning is configured.
service:
  access:
    webhook:
      enabled: ${SERVICE_ACCESS_WEBHOOK_ENABLED:false}
      allowed-hosts: ${SERVICE_ACCESS_WEBHOOK_ALLOWED_HOSTS:}
